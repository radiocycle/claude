<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<style>
  :root {
    --fg: #1d1b20;
    --muted: #4a454e;
    --surface: #f2ecf4;
    --surface-2: #e6e0e9;
    --outline: #ccc4cf;
    --accent: #6b3fd4;
    --error: #ba1a1a;
    --font-size: 16px;
    --code-size: 13px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--fg);
    font-size: var(--font-size);
    line-height: 1.55;
    font-family: system-ui, -apple-system, "Roboto", sans-serif;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  #content { padding: 0; overflow-wrap: anywhere; word-break: break-word; }
  #content > *:first-child { margin-top: 0; }
  #content > *:last-child { margin-bottom: 0; }

  p { margin: 0 0 0.7em; }
  h1, h2, h3, h4, h5, h6 { margin: 1.1em 0 0.45em; line-height: 1.3; font-weight: 700; }
  h1 { font-size: 1.42em; }
  h2 { font-size: 1.28em; }
  h3 { font-size: 1.14em; }
  h4, h5, h6 { font-size: 1em; }

  ul, ol { margin: 0 0 0.7em; padding-left: 1.45em; }
  li { margin: 0.18em 0; }
  li > ul, li > ol { margin-bottom: 0.2em; }
  li.task { list-style: none; margin-left: -1.2em; }
  li.task input { margin-right: 0.5em; vertical-align: middle; }

  blockquote {
    margin: 0 0 0.7em; padding: 0.1em 0 0.1em 0.9em;
    border-left: 3px solid var(--accent); color: var(--muted);
  }
  hr { border: none; border-top: 1px solid var(--outline); margin: 1.1em 0; }
  a { color: var(--accent); text-decoration: underline; }

  code:not([class*="katex"]) {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: var(--code-size);
    background: var(--surface-2);
    padding: 0.12em 0.34em;
    border-radius: 6px;
  }

  .codeblock {
    margin: 0 0 0.75em;
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
  }
  .codeblock .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px 4px 14px;
    font-size: 11px; color: var(--muted);
    text-transform: lowercase; letter-spacing: 0.02em;
  }
  .codeblock .bar button {
    font: inherit; color: var(--accent); background: none; border: none;
    padding: 4px 10px; border-radius: 999px; cursor: pointer;
  }
  .codeblock pre {
    margin: 0; padding: 0 14px 12px;
    overflow-x: auto; overscroll-behavior-x: contain;
  }
  .codeblock pre code {
    background: none; padding: 0; border-radius: 0;
    font-size: var(--code-size); line-height: 1.5; white-space: pre;
  }

  .tablewrap { overflow-x: auto; overscroll-behavior-x: contain; margin: 0 0 0.8em; }
  table { border-collapse: collapse; width: auto; min-width: 100%; font-size: 0.94em; }
  th, td { border: 1px solid var(--outline); padding: 7px 11px; text-align: left; vertical-align: top; }
  th { background: var(--surface); font-weight: 600; }
  tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface) 45%, transparent); }

  .math-display {
    overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain;
    margin: 0.5em 0 0.9em; padding: 2px 0;
  }
  .math-display .katex-display { margin: 0; }
  .katex { font-size: 1.05em; }
  .math-error {
    color: var(--error);
    background: color-mix(in srgb, var(--error) 12%, transparent);
  }

  .imagelink { display: inline-block; color: var(--accent); }
</style>
<script src="marked.umd.js"></script>
<script src="katex.min.js"></script>
</head>
<body>
<div id="content"></div>
<script>
(function () {
  var content = document.getElementById('content');
  var bridge = window.AndroidRender || null;
  var lastHeight = -1;

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ---- KaTeX ---------------------------------------------------------------

  var MACROS = {
    '\\RR': '\\mathbb{R}', '\\NN': '\\mathbb{N}', '\\ZZ': '\\mathbb{Z}',
    '\\QQ': '\\mathbb{Q}', '\\CC': '\\mathbb{C}', '\\eps': '\\varepsilon',
    '\\dd': '\\mathrm{d}', '\\argmin': '\\operatorname{arg\\,min}',
    '\\argmax': '\\operatorname{arg\\,max}'
  };

  function renderMath(tex, display) {
    try {
      var html = katex.renderToString(tex, {
        displayMode: !!display,
        throwOnError: false,
        errorColor: 'currentColor',
        strict: 'ignore',
        trust: false,
        macros: MACROS,
        maxExpand: 1000
      });
      return display ? '<div class="math-display">' + html + '</div>' : html;
    } catch (e) {
      return '<code class="math-error">' + escapeHtml(tex) + '</code>';
    }
  }

  // Environments that stand on their own and are their own display math.
  var ENVS = 'equation\\*?|align\\*?|alignat\\*?|gather\\*?|multline\\*?|flalign\\*?|split|aligned|gathered|cases|array|smallmatrix|[pbBvV]?matrix|CD';

  var mathBlock = {
    name: 'mathBlock',
    level: 'block',
    start: function (src) {
      var m = src.match(/(\$\$|\\\[|\\begin\{)/);
      return m ? m.index : undefined;
    },
    tokenizer: function (src) {
      var m = /^\s*\$\$([\s\S]+?)\$\$[ \t]*(?:\n+|$)/.exec(src);
      if (m) return { type: 'mathBlock', raw: m[0], text: m[1] };
      m = /^\s*\\\[([\s\S]+?)\\\][ \t]*(?:\n+|$)/.exec(src);
      if (m) return { type: 'mathBlock', raw: m[0], text: m[1] };
      m = new RegExp('^\\s*(\\\\begin\\{(' + ENVS + ')\\}[\\s\\S]+?\\\\end\\{\\2\\})[ \\t]*(?:\\n+|$)').exec(src);
      if (m) return { type: 'mathBlock', raw: m[0], text: m[1] };
      return undefined;
    },
    renderer: function (token) { return renderMath(token.text, true); }
  };

  var mathInline = {
    name: 'mathInline',
    level: 'inline',
    start: function (src) {
      var m = src.match(/(\$|\\\()/);
      return m ? m.index : undefined;
    },
    tokenizer: function (src) {
      // Display math that sits inside a paragraph rather than on its own line.
      var m = /^\$\$([\s\S]+?)\$\$/.exec(src);
      if (m) return { type: 'mathInline', raw: m[0], text: m[1], display: true };
      m = /^\\\(([\s\S]+?)\\\)/.exec(src);
      if (m) return { type: 'mathInline', raw: m[0], text: m[1], display: false };
      // $...$ — rejected when it looks like prose or currency: no padding spaces,
      // no blank line inside, and never "$5 and $10".
      m = /^\$(?!\$)((?:\\[\s\S]|[^\\$])+?)\$(?!\d)/.exec(src);
      if (m && m[1].trim() && !/^\s|\s$/.test(m[1]) && !/\n\s*\n/.test(m[1])) {
        return { type: 'mathInline', raw: m[0], text: m[1], display: false };
      }
      return undefined;
    },
    renderer: function (token) { return renderMath(token.text, token.display); }
  };

  // ---- marked --------------------------------------------------------------

  var BaseRenderer = marked.Renderer.prototype;

  var renderer = {
    // Model output is untrusted, so raw HTML is shown as text rather than executed.
    html: function (token) { return escapeHtml(token.raw != null ? token.raw : token.text); },

    code: function (token) {
      var lang = (token.lang || '').split(/\s+/)[0];
      return '<div class="codeblock"><div class="bar"><span>' +
        escapeHtml(lang || 'code') +
        '</span><button data-copy="1">copy</button></div><pre><code>' +
        escapeHtml(token.text) + '</code></pre></div>';
    },

    table: function (token) {
      return '<div class="tablewrap">' + BaseRenderer.table.call(this, token) + '</div>';
    },

    link: function (token) {
      var href = String(token.href || '');
      if (/^\s*(javascript|data|vbscript|file):/i.test(href)) {
        return this.parser.parseInline(token.tokens || []);
      }
      var title = token.title ? ' title="' + escapeHtml(token.title) + '"' : '';
      return '<a href="' + escapeHtml(href) + '"' + title + '>' +
        this.parser.parseInline(token.tokens || []) + '</a>';
    },

    // Network loads are blocked in this WebView, so an image becomes a link to it.
    image: function (token) {
      return '<a class="imagelink" href="' + escapeHtml(String(token.href || '')) + '">🖼 ' +
        escapeHtml(token.text || token.href || 'image') + '</a>';
    },

    checkbox: function (token) {
      return '<input type="checkbox" disabled' + (token.checked ? ' checked' : '') + '>';
    },

    listitem: function (token) {
      var cls = token.task ? ' class="task"' : '';
      return '<li' + cls + '>' + this.parser.parse(token.tokens || []) + '</li>\n';
    }
  };

  marked.use({
    gfm: true,
    breaks: true,
    extensions: [mathBlock, mathInline],
    renderer: renderer
  });

  // ---- Rendering -----------------------------------------------------------

  function report() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h !== lastHeight && h > 0) {
      lastHeight = h;
      if (bridge && bridge.setHeight) bridge.setHeight(h);
    }
  }

  function afterPaint(fn) {
    requestAnimationFrame(function () { requestAnimationFrame(fn); });
  }

  function settle() {
    report();
    reportExclusions();
  }

  window.LlmHub = {
    setTheme: function (json) {
      var theme;
      try { theme = JSON.parse(json); } catch (e) { return; }
      var root = document.documentElement.style;
      Object.keys(theme).forEach(function (k) { root.setProperty('--' + k, theme[k]); });
      afterPaint(settle);
    },

    setContent: function (markdown) {
      var html;
      try {
        html = marked.parse(markdown == null ? '' : String(markdown));
      } catch (e) {
        console.error('marked parse error:', e);
        html = '<pre style="white-space:pre-wrap;word-break:break-word;">' + escapeHtml(String(markdown || '')) + '</pre>';
      }
      content.innerHTML = html;
      afterPaint(settle);
    }
  };

  content.addEventListener('click', function (event) {
    var copy = event.target.closest ? event.target.closest('button[data-copy]') : null;
    if (copy) {
      var block = copy.closest('.codeblock');
      var code = block ? block.querySelector('code') : null;
      if (code && bridge && bridge.copy) bridge.copy(code.textContent);
      copy.textContent = 'copied';
      setTimeout(function () { copy.textContent = 'copy'; }, 1400);
      event.preventDefault();
      return;
    }
    var link = event.target.closest ? event.target.closest('a[href]') : null;
    if (link) {
      event.preventDefault();
      if (bridge && bridge.openUrl) bridge.openUrl(link.getAttribute('href'));
    }
  });

  // Tell the host whether this touch began over something that scrolls sideways, so it can decide
  // between panning that region and letting the surrounding app handle the drag.
  var SCROLLERS = '.tablewrap, .math-display, .codeblock pre';

  function reportScrollable(event) {
    if (!bridge || !bridge.setOverScrollableRegion) return;
    var target = event.target;
    var el = target && target.closest ? target.closest(SCROLLERS) : null;
    bridge.setOverScrollableRegion(!!(el && el.scrollWidth > el.clientWidth + 1));
  }

  function reportExclusions() {
    if (!bridge || !bridge.setExclusions) return;
    var rects = [];
    var nodes = document.querySelectorAll(SCROLLERS);
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.scrollWidth > el.clientWidth + 1) {
        var box = el.getBoundingClientRect();
        rects.push({ top: Math.max(0, Math.round(box.top)), height: Math.round(box.height) });
      }
    }
    try { bridge.setExclusions(JSON.stringify(rects)); } catch (e) { }
  }

  document.addEventListener('touchstart', reportScrollable, { passive: true });
  document.addEventListener('touchmove', reportScrollable, { passive: true });
  document.addEventListener('touchend', function () {
    if (bridge && bridge.setOverScrollableRegion) bridge.setOverScrollableRegion(false);
  }, { passive: true });

  if (window.ResizeObserver) new ResizeObserver(settle).observe(document.body);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { afterPaint(settle); });
  if (bridge && bridge.onReady) bridge.onReady();
})();
</script>
</body>
</html>
