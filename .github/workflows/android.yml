name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Report resolved Compose versions
        run: |
          ./gradlew -q :app:dependencies --configuration debugRuntimeClasspath --no-daemon \
            | grep -E 'androidx\.compose(\.material3)?:' | sort -u || true

      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llmhub-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Prepare Debug APK
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/llmhub-debug.apk 2>/dev/null || cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/llmhub-debug.apk

      - name: Publish Debug APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-build-${{ github.run_number }}"
          name: "Debug Build #${{ github.run_number }} (${{ github.ref_name }})"
          body: |
            ### Automated CI Build
            * **Branch**: `${{ github.ref_name }}`
            * **Commit**: `${{ github.sha }}`
            * **Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/debug/llmhub-debug.apk

